workflows:
  ios-workflow:
    name: Muzik iOS IPA Build

    environment:
      xcode: latest

    scripts:
      - name: Install CocoaPods
        script: |
          cd src
          pod install

      - name: Build Archive
        script: |
          cd src
          xcodebuild \
          -workspace muzik.xcworkspace \
          -scheme muzik \
          -configuration Release \
          -archivePath build/muzik.xcarchive \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          archive

    artifacts:
      - src/build/**/*.xcarchive
