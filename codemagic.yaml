workflows:
  ios-workflow:
    name: Muzik iOS IPA Build
    environment:
      xcode: latest

    scripts:
      - name: Install CocoaPods
        script: |
          cd src
          pod install

      - name: Build iOS
        script: |
          cd src
          xcodebuild -workspace muzik.xcworkspace \
          -scheme muzik \
          -configuration Release \
          -sdk iphoneos \
          -destination 'generic/platform=iOS' \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build

    artifacts:
      - src/build/**/*.ipa
