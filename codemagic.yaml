workflows:
ios-workflow:
name: Muzik iOS IPA Build

```
environment:
  xcode: latest

scripts:
  - name: Install CocoaPods
    script: |
      cd src
      pod install

  - name: Build iOS Archive (No Signing)
    script: |
      cd src
      xcodebuild \
        -workspace muzik.xcworkspace \
        -scheme muzik \
        -configuration Release \
        -sdk iphoneos \
        -destination 'generic/platform=iOS' \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO \
        CODE_SIGN_IDENTITY="" \
        -archivePath build/muzik.xcarchive \
        archive

  - name: Create IPA
    script: |
      cd src
      mkdir -p build/ipa/Payload
      cp -R build/muzik.xcarchive/Products/Applications/*.app build/ipa/Payload/
      cd build/ipa
      zip -r muzik.ipa Payload

artifacts:
  - src/build/ipa/*.ipa
```
