workflows:
  ios-workflow:
    name: Muzik iOS IPA Build
    environment:
      xcode: latest
      # Sertifikalarınızı Codemagic panelinde tanımladığınızda bu grup otomatik gelir
      groups:
        - apple_auth 
    scripts:
      - name: Install CocoaPods
        script: |
          cd src && pod install
      - name: Build and Archive iOS
        script: |
          cd src
          # keychain'i otomatik kurmak için (Eğer Codemagic paneline sertifika yüklediyseniz)
          keychain initialize
          # Provisioning profile'ları indir
          app-store-connect fetch-signing-files "com.your.bundle.id" --project-id "YOUR_APP_ID" --type IOS_APP_STORE --install
          
          # IPA oluşturma komutu
          xcodebuild -workspace muzik.xcworkspace \
            -scheme muzik \
            -configuration Release \
            -archivePath $(pwd)/build/Muzik.xcarchive \
            archive
          
          # Arşivi IPA'ya dönüştür
          xcodebuild -exportArchive \
            -archivePath $(pwd)/build/Muzik.xcarchive \
            -exportOptionsPlist export_options.plist \
            -exportPath $(pwd)/build
    artifacts:
      - src/build/*.ipa
